<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3c7"/>
      <stop offset="1" stop-color="#eef7dc"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a2a" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#1e3a2a" stop-opacity=".62"/>
      <stop offset=".72" stop-color="#1e3a2a" stop-opacity="0"/>
    </linearGradient>
    <g id="tulip">
      <path d="M0 0 C1 -25 -1 -50 0 -72" stroke="#3a7d44" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M0 -6 C-26 -24 -26 -52 -12 -64 C-12 -44 -6 -26 0 -6Z" fill="#4c9a52"/>
      <path d="M0 -12 C22 -28 24 -46 14 -56 C12 -38 8 -26 0 -12Z" fill="#5aab5f"/>
      <path d="M-14 -72 C-17 -94 -8 -104 -8 -104 L0 -92 L8 -104 C8 -104 17 -94 14 -72 C9 -63 -9 -63 -14 -72Z"/>
      <path d="M-4 -70 C-6 -86 0 -96 0 -92 C0 -96 6 -86 4 -70Z" fill="#fff" opacity=".22"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- sun and clouds -->
  <circle cx="880" cy="180" r="82" fill="#fffbe0" opacity=".45"/>
  <circle cx="880" cy="180" r="52" fill="#fff4bd"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="740" cy="160" rx="62" ry="17"/><ellipse cx="772" cy="148" rx="36" ry="20"/>
    <ellipse cx="1130" cy="140" rx="52" ry="14"/><ellipse cx="1154" cy="130" rx="28" ry="15"/>
  </g>

  <!-- hills -->
  <path d="M0 255 C200 200 380 240 560 220 C760 196 950 232 1200 198 L1200 420 L0 420Z" fill="#bfe0a3"/>
  <path d="M0 300 C220 258 420 300 640 280 C840 262 1000 302 1200 268 L1200 420 L0 420Z" fill="#8cc574"/>

  <!-- blossom tree -->
  <path d="M1040 300 C1036 262 1030 232 1018 206 M1034 244 C1052 228 1070 216 1088 200" stroke="#6b4a33" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g fill="#f6bfd4">
    <circle cx="1012" cy="190" r="38"/><circle cx="1054" cy="172" r="44"/><circle cx="1094" cy="194" r="32"/>
    <circle cx="1046" cy="212" r="30"/><circle cx="980" cy="208" r="24"/>
  </g>
  <g fill="#fbe0ea">
    <circle cx="1040" cy="160" r="16"/><circle cx="1000" cy="182" r="12"/><circle cx="1086" cy="184" r="11"/><circle cx="1062" cy="206" r="9"/>
  </g>
  <g fill="#f6bfd4" opacity=".9">
    <circle cx="930" cy="250" r="4"/><circle cx="1120" cy="262" r="3.5"/><circle cx="890" cy="226" r="3"/><circle cx="1160" cy="236" r="4"/>
  </g>

  <!-- front meadow -->
  <path d="M0 350 C240 318 480 346 720 334 C930 324 1060 346 1200 328 L1200 420 L0 420Z" fill="#5c9c49"/>

  <!-- sprouts -->
  <g stroke="#3f7f35" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M640 372 l0 -14 m0 6 c-8 -8 -14 -6 -16 -4 m16 2 c6 -8 12 -8 15 -6"/>
    <path d="M700 384 l0 -12 m0 5 c-7 -7 -12 -5 -14 -3 m14 2 c5 -7 10 -7 13 -5"/>
    <path d="M580 392 l0 -12 m0 5 c-7 -7 -12 -5 -14 -3 m14 2 c5 -7 10 -7 13 -5"/>
  </g>

  <!-- tulips -->
  <use href="#tulip" transform="translate(770 420) scale(.85)" fill="#ff8fab"/>
  <use href="#tulip" transform="translate(822 420) scale(1.05)" fill="#e63946"/>
  <use href="#tulip" transform="translate(872 420) scale(.9)" fill="#ffd166"/>
  <use href="#tulip" transform="translate(925 420) scale(1.2)" fill="#ff8fab"/>
  <use href="#tulip" transform="translate(980 420) scale(.95)" fill="#f77f00"/>
  <use href="#tulip" transform="translate(1030 420) scale(1.1)" fill="#e63946"/>
  <use href="#tulip" transform="translate(1082 420) scale(.88)" fill="#ffd166"/>
  <use href="#tulip" transform="translate(1135 420) scale(1.15)" fill="#ff8fab"/>
  <use href="#tulip" transform="translate(1182 420) scale(.92)" fill="#e63946"/>

  <rect width="1200" height="420" fill="url(#shade)"/>
</svg>
