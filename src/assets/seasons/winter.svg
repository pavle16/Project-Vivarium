<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset=".55" stop-color="#457b9d"/>
      <stop offset="1" stop-color="#a8dadc"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1f36" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#0d1f36" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#0d1f36" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f93b3"/><stop offset=".6" stop-color="#cfe0ea"/>
    </linearGradient>
    <linearGradient id="snow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86a8c4"/><stop offset=".65" stop-color="#e6f0f6"/>
    </linearGradient>
    <linearGradient id="snow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dbad1"/><stop offset=".7" stop-color="#ffffff"/>
    </linearGradient>
    <g id="pine">
      <rect x="-6" y="-14" width="12" height="16" fill="#5b3a29"/>
      <polygon points="-52,-12 52,-12 0,-84" fill="#1f4e3d"/>
      <polygon points="-42,-52 42,-52 0,-116" fill="#24594a"/>
      <polygon points="-30,-90 30,-90 0,-146" fill="#2a6655"/>
      <polygon points="0,-146 -13,-122 -6,-125 0,-119 6,-125 13,-122" fill="#fff"/>
      <polygon points="0,-116 -20,-84 -8,-90 0,-82 8,-90 20,-84" fill="#fff" opacity=".9"/>
      <polygon points="0,-84 -26,-46 -10,-54 0,-44 10,-54 26,-46" fill="#fff" opacity=".85"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- stars and moon -->
  <g fill="#fff">
    <circle cx="640" cy="40" r="1.8"/><circle cx="720" cy="80" r="1.4"/><circle cx="820" cy="34" r="2"/>
    <circle cx="1100" cy="40" r="1.6"/><circle cx="1160" cy="96" r="1.3"/><circle cx="880" cy="110" r="1.2"/>
    <circle cx="560" cy="96" r="1.3"/>
  </g>
  <circle cx="830" cy="170" r="66" fill="#f1faee" opacity=".12"/>
  <circle cx="830" cy="170" r="40" fill="#f1faee"/>
  <circle cx="817" cy="160" r="7" fill="#dbe7ee"/><circle cx="842" cy="182" r="5" fill="#dbe7ee"/>

  <!-- snowy hills -->
  <path d="M0 262 C200 220 400 252 620 232 C820 214 1000 242 1200 214 L1200 420 L0 420Z" fill="url(#snow1)"/>

  <!-- back pines -->
  <use href="#pine" transform="translate(760 262) scale(.6)"/>
  <use href="#pine" transform="translate(1160 236) scale(.65)"/>
  <use href="#pine" transform="translate(700 268) scale(.5)"/>

  <path d="M0 310 C230 276 450 310 690 292 C890 278 1050 300 1200 282 L1200 420 L0 420Z" fill="url(#snow2)"/>

  <!-- front pines -->
  <use href="#pine" transform="translate(910 330) scale(1.05)"/>
  <use href="#pine" transform="translate(1010 334) scale(1.22)"/>
  <use href="#pine" transform="translate(1110 334) scale(.95)"/>

  <path d="M0 360 C260 334 520 358 760 348 C960 340 1080 356 1200 346 L1200 420 L0 420Z" fill="url(#snow3)"/>

  <!-- falling snow -->
  <g fill="#fff" opacity=".85">
    <circle cx="680" cy="150" r="3"/><circle cx="760" cy="200" r="2.4"/><circle cx="840" cy="160" r="3.2"/>
    <circle cx="930" cy="200" r="2.2"/><circle cx="1060" cy="170" r="3"/><circle cx="1140" cy="210" r="2.6"/>
    <circle cx="700" cy="250" r="2.2"/><circle cx="1180" cy="150" r="2.4"/><circle cx="890" cy="70" r="2.4"/>
    <circle cx="1060" cy="250" r="2.4"/><circle cx="790" cy="300" r="2.8"/><circle cx="600" cy="200" r="2.2"/>
  </g>

  <rect width="1200" height="420" fill="url(#shade)"/>
</svg>
